<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WebRTC WebGL Player</title>
<style>
    body { font-family: monospace; margin: 20px; background: #000; }
    textarea { width: 100%; margin: 10px 0; background: #111; color: #0f0; border: 1px solid #0f0; }
    button { padding: 10px 20px; cursor: pointer; background: #0f0; color: #000; border: none; font-weight: bold; }
    canvas { width: 100%; max-width: 1280px; background: #000; margin-top: 20px; display: block; }
</style>
</head>
<body>

<h3 style="color:#0f0;">Offer</h3>
<textarea id="offer" rows="6" cols="100"></textarea>
<br>
<button id="connect">Connect</button>

<h3 style="color:#0f0;">Answer</h3>
<textarea id="answer" rows="6" cols="100" readonly></textarea>

<canvas id="canvas"></canvas>

<script>
let pc, gl, program, texture;
const canvas = document.getElementById('canvas');

// 创建隐藏video元素用于解码
const videoElement = document.createElement('video');
videoElement.autoplay = true;
videoElement.playsinline = true;
videoElement.muted = true;
videoElement.style.display = 'none';
document.body.appendChild(videoElement);

// 初始化WebGL
function initWebGL() {
    gl = canvas.getContext('webgl');
    if (!gl) return;
    
    // 顶点着色器
    const vsSource = `
        attribute vec2 a_position;
        varying vec2 v_texCoord;
        void main() {
            gl_Position = vec4(a_position, 0.0, 1.0);
            v_texCoord = a_position * 0.5 + 0.5;
        }
    `;
    
    // 片段着色器
    const fsSource = `
        precision highp float;
        uniform sampler2D u_texture;
        varying vec2 v_texCoord;
        void main() {
            gl_FragColor = texture2D(u_texture, v_texCoord);
        }
    `;
    
    function createShader(source, type) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            gl.deleteShader(shader);
            return null;
        }
        return shader;
    }
    
    const vertexShader = createShader(vsSource, gl.VERTEX_SHADER);
    const fragmentShader = createShader(fsSource, gl.FRAGMENT_SHADER);
    
    program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    gl.useProgram(program);
    
    // 顶点数据
    const positions = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
    
    const positionLoc = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(positionLoc);
    gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);
    
    // 创建纹理
    texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.uniform1i(gl.getUniformLocation(program, 'u_texture'), 0);
}

// 渲染视频帧
function renderFrame() {
    if (gl && videoElement.videoWidth && videoElement.readyState >= 2) {
        if (canvas.width !== videoElement.videoWidth || canvas.height !== videoElement.videoHeight) {
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
            canvas.style.width = '100%';
            canvas.style.height = 'auto';
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, videoElement);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    requestAnimationFrame(renderFrame);
}

// WebRTC连接
document.getElementById("connect").onclick = async () => {
    const offer = JSON.parse(document.getElementById("offer").value);
    
    if (pc) pc.close();
    pc = new RTCPeerConnection({ bundlePolicy: "max-bundle" });
    pc.addTransceiver('video', { direction: 'recvonly' });
    
    pc.ontrack = (e) => {
        videoElement.srcObject = e.streams[0];
        videoElement.play();
    };
    
    pc.onicegatheringstatechange = () => {
        if (pc.iceGatheringState === "complete") {
            document.getElementById("answer").value = 
                JSON.stringify({ type: pc.localDescription.type, sdp: pc.localDescription.sdp }, null, 2);
        }
    };
    
    await pc.setRemoteDescription(offer);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
};

// 初始化
initWebGL();
renderFrame();
</script>
</body>
</html>
